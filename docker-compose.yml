services:
  # Database
  postgres:
    image: postgres:16
    restart: always
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 0.5

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8068:80"
    volumes:
      - ./db/pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f gunicorn"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 0.5
    
  redis:
    image: redis:8.6.2-alpine
    restart: unless-stopped
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10m 
      timeout: 10s 
      retries: 3 
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - 6333:6333
    volumes:
      - ./db/qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./db/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10m
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 0.5
        reservations:
          cpus: 0.1
          memory: 128M

  storage:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: storage
    user: "0:0"
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_SERVER_DOMAINS: storage:9000
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./db/storage_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'curl -s http://127.0.0.1:9000/health | grep -q ''"status":"ok"''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0


  # system one model
  laya:
    build:
      context: ./llm/laya
    restart: unless-stopped
    container_name: laya
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: 20.0
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - 8000:8000
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # - LAYA_DEVICE=cuda
      - LAYA_DEFAULT_MODEL=multilingual
    volumes:
      - /data/cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10m 
      timeout: 10s 
      retries: 3 
      start_period: 30s


  # system two model
  vllm:
    image: vllm/vllm-openai:v0.31.0  #v0.23.0, gptoss, gemma4
    restart: unless-stopped
    container_name: vllm
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 240G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ports:
    #   - 8000:8000
    environment:
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=${VLLM_ALLOW_RUNTIME_LORA_UPDATING:-False}
      - TORCH_CUDA_ARCH_LIST=9.0
      - LMCACHE_CHUNK_SIZE=256
      - LMCACHE_LOCAL_CPU=False
      - LMCACHE_MAX_LOCAL_CPU_SIZE=20.0
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
    volumes:
      - /root/cache:/root/.cache
    command:
      - Qwen/Qwen3.6-35B-A3B-FP8
      - --dtype=auto
      - --kv-cache-dtype=fp8
      - --max-model-len=200000 # qwen3.6 262144, gemma4 256000
      - --gpu-memory-utilization=0.65
      - --async-scheduling
      - --scheduling-policy=priority 
      - --tool-call-parser=qwen3_coder # qwen3_coder (qwen 3.6), gemma4, qwen3_xml (ornith-1.0)
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3 # qwen3, gemma4
      - --max-num-seqs=128
      - --enable-prefix-caching
      - --served-model-name=falcon-llm
      # - --speculative-config={"method":"mtp","num_speculative_tokens":2} # thi thoảng bị nghẽn
      # - --enable-chunked-prefill # phù hợp khi prompt dài
      # - --max-num-batched-tokens=32768
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://0.0.0.0:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 20

  hf-prefetch:
    profiles:
      - tools
    image: vllm/vllm-openai:v0.31.0
    entrypoint:
      - python3
      - -c
    command:
      - |
        import os
        from huggingface_hub import snapshot_download

        model_id = os.environ.get('MODEL_ID')
        revision = os.environ.get('MODEL_REVISION') or None
        token = os.environ.get('HF_TOKEN') or None

        assert model_id, 'MODEL_ID is required'

        path = snapshot_download(
            repo_id=model_id,
            revision=revision,
            token=token,
            resume_download=True,
        )
        print(f'Prefetched {model_id} -> {path}')
    environment:
      - HF_HOME=/root/.cache/huggingface
      # - HF_TOKEN=${HF_TOKEN}
      - MODEL_ID=Qwen/Qwen3.8-27B-FP8
      # - MODEL_REVISION=${MODEL_REVISION:-}
    volumes:
      - /root/cache:/root/.cache

  vllm_bench:
    profiles:
      - tools
    image: vllm/vllm-openai:v0.31.0
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - /root/cache:/root/.cache
      - ./llm/bench_results:/results
      - ./llm/bench.sh:/bench.sh:ro
    entrypoint: ["bash", "/bench.sh"]

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.7-stable.patch.1
    restart: unless-stopped
    container_name: litellm
    ports:
      - 8000:4000
    volumes:
      - ./llm/litellm_config.yml:/app/config.yml
    command:
      - "--config=/app/config.yml"
    environment:
      DATABASE_URL: "postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@postgres:5432/${LITELLM_DB_NAME}"
      STORE_MODEL_IN_DB: "True" 
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY} 
    healthcheck: 
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')" 
      interval: 5m  
      timeout: 10s 
      retries: 3 
      start_period: 40s 
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: 4.0


  # Triton
  triton:
    build: ./triton
    container_name: triton
    runtime: nvidia
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: 2.0
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_LAUNCH_BLOCKING=1
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - /data/cache:/root/.cache
      - ./triton/models:/models
    command: 
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=yolo_det
      # - --load-model=yolo_seg
      # - --log-verbose=1 
      # - --log-info=1 
      # - --log-warning=1 
      # - --log-error=1
    healthcheck:
      test: ["CMD-SHELL", 'curl -sf http://localhost:8000/v2/health/ready']
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # API
  py_api:
    build: ./py_api
    container_name: py_api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0
    ports:
      - "8080:8080"
    environment:
      - TRITON_HOST=triton
      - TRITON_POOL_SIZE=8
    depends_on:
      - triton

  go_api:
    build: ./go_api
    container_name: go_api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0
    ports:
      - "8090:8090"
    environment:
      - TRITON_HOST=triton
      # - TRITON_POOL_SIZE=8
      - GIN_MODE=release
    depends_on:
      - triton

