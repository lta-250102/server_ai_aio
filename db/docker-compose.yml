services:
  postgres:
    image: postgres:16
    restart: always
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 30s
    networks:
      - db
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin
    networks:
      - db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8068:80"
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f gunicorn"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s

  redis:
    image: redis:8.6.2-alpine
    restart: unless-stopped
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - db
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10m 
      timeout: 10s 
      retries: 3 
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - 6333:6333
    networks:
      - db
    volumes:
      - ./qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10m
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - db
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0
        reservations:
          cpus: 0.1
          memory: 128M

  storage:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: storage
    user: "0:0"
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_SERVER_DOMAINS: storage:9000
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./storage_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'curl -s http://127.0.0.1:9000/health | grep -q ''"status":"ok"''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: 1.0

networks:
  db:
    external: true
    name: db