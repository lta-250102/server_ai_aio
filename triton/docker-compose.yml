services:
  triton:
    build: .
    container_name: triton_server
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_LAUNCH_BLOCKING=1
    ports:
      - "8002:8000"
      - "8003:8001"
      - "8004:8002"
    volumes:
      - /data/cache:/root/.cache
      - ./models:/models
    command: 
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=yolo_det
      - --load-model=yolo_seg
    networks:
      - triton

networks:
  triton:
    external: true
    name: triton